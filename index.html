<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Todo App</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 480px;
            margin: 24px auto;
            padding: 24px;
            background-color: #fff;
            border-radius: 16px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .input-field:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        .add-button {
            background-color: #4CAF50;
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .add-button:hover {
            background-color: #3e8e41;
        }
        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        .todo-item:last-child {
            border-bottom: none;
        }
        .todo-item:hover {
            background-color: #f5f7fa;
        }
        .todo-text {
            flex: 1;
            padding: 0 12px;
        }
        .todo-text.completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .delete-button {
            background-color: #fff;
            color: #666;
            padding: 8px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }
        .delete-button:hover {
            background-color: #f5f7fa;
        }
        .counter {
            margin-top: 24px;
            color: #666;
        }
        .empty-state {
            text-align: center;
            padding: 24px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <input type="text" id="input-field" class="input-field" placeholder="Add new todo" autofocus>
            <button id="add-button" class="add-button">Add</button>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="counter" class="counter"></p>
        <p id="empty-state" class="empty-state">No tasks yet. Add one above 👆</p>
    </div>
    <script>
        const inputField = document.getElementById('input-field');
        const addButton = document.getElementById('add-button');
        const todoList = document.getElementById('todo-list');
        const counter = document.getElementById('counter');
        const emptyState = document.getElementById('empty-state');

        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        function renderTodos() {
            todoList.innerHTML = '';
            todos.forEach((todo, index) => {
                const todoItem = document.createElement('li');
                todoItem.classList.add('todo-item');
                todoItem.innerHTML = `
                    <div class="todo-text ${todo.completed ? 'completed' : ''}">${todo.text}</div>
                    <button class="delete-button" data-index="${index}">Delete</button>
                `;
                todoList.appendChild(todoItem);
            });
            updateCounter();
            updateEmptyState();
        }

        function updateCounter() {
            const activeTodos = todos.filter(todo => !todo.completed);
            counter.textContent = `${activeTodos.length} item${activeTodos.length === 1 ? '' : 's'} left`;
        }

        function updateEmptyState() {
            if (todos.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }
        }

        function addTodo(text) {
            const newTodo = {
                id: Date.now(),
                text: text.trim(),
                completed: false
            };
            todos.push(newTodo);
            localStorage.setItem('todos', JSON.stringify(todos));
            renderTodos();
            inputField.value = '';
            inputField.focus();
        }

        function deleteTodo(index) {
            todos.splice(index, 1);
            localStorage.setItem('todos', JSON.stringify(todos));
            renderTodos();
        }

        function toggleCompleted(index) {
            todos[index].completed = !todos[index].completed;
            localStorage.setItem('todos', JSON.stringify(todos));
            renderTodos();
        }

        addButton.addEventListener('click', () => {
            if (inputField.value.trim() !== '') {
                addTodo(inputField.value);
            }
        });

        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && inputField.value.trim() !== '') {
                addTodo(inputField.value);
            }
        });

        todoList.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-button')) {
                const index = e.target.dataset.index;
                deleteTodo(index);
            } else if (e.target.classList.contains('todo-text')) {
                const index = Array.prototype.indexOf.call(todoList.children, e.target.parentNode);
                toggleCompleted(index);
            }
        });

        renderTodos();
    </script>
</body>
</html>
