<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Todo App</title><style>body { font-family: Arial, sans-serif; } .todo-item { padding: 10px; border-bottom: 1px solid #ccc; } .todo-item.completed { text-decoration: line-through; color: #666; } .todo-item.completed::before { content: '\2713'; margin-right: 10px; color: #0f0; } .todo-input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; } .todo-button { background-color: #4CAF50; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; } .todo-button:hover { background-color: #3e8e41; } .todo-count { margin-top: 10px; }</style></head><body><h1>Todo App</h1><input type='text' id='todo-input' class='todo-input' placeholder='Add new todo item'><button id='todo-button' class='todo-button'>Add</button><ul id='todo-list'></ul><p id='todo-count'></p><script>let todos = JSON.parse(localStorage.getItem('todos')) || [];const todoList = document.getElementById('todo-list');const todoInput = document.getElementById('todo-input');const todoButton = document.getElementById('todo-button');const todoCount = document.getElementById('todo-count');todoButton.addEventListener('click', addTodo);todoList.addEventListener('click', deleteTodo);renderTodos();function addTodo() { const newTodo = { text: todoInput.value, completed: false }; todos.push(newTodo); localStorage.setItem('todos', JSON.stringify(todos)); renderTodos(); todoInput.value = ''; } function deleteTodo(event) { if (event.target.classList.contains('delete')) { const todoIndex = event.target.dataset.index; todos.splice(todoIndex, 1); localStorage.setItem('todos', JSON.stringify(todos)); renderTodos(); } else if (event.target.textContent === 'Complete') { const todoIndex = event.target.dataset.index; todos[todoIndex].completed = true; localStorage.setItem('todos', JSON.stringify(todos)); renderTodos(); } } function renderTodos() { todoList.innerHTML = ''; todos.forEach((todo, index) => { const todoItem = document.createElement('li'); todoItem.classList.add('todo-item'); if (todo.completed) { todoItem.classList.add('completed'); } const todoText = document.createTextNode(todo.text); todoItem.appendChild(todoText); const deleteButton = document.createElement('button'); deleteButton.classList.add('delete'); deleteButton.textContent = 'Delete'; deleteButton.dataset.index = index; todoItem.appendChild(deleteButton); const completeButton = document.createElement('button'); completeButton.textContent = 'Complete'; completeButton.dataset.index = index; todoItem.appendChild(completeButton); todoList.appendChild(todoItem); }); todoCount.textContent = `Remaining: ${todos.filter(todo => !todo.completed).length}`; }</script></body></html>
