<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Todo App</title><style>body { font-family: Arial, sans-serif; } .todo-item { padding: 10px; border-bottom: 1px solid #ccc; } .todo-item.completed { text-decoration: line-through; color: #666; } .todo-item.completed::before { content: '\2713'; margin-right: 10px; color: #0f0; }</style></head><body><h1>Todo App</h1><input type='text' id='todo-input' placeholder='Add new todo'><button id='add-todo-btn'>Add</button><ul id='todo-list'></ul><p id='todo-count'></p><script>let todos = JSON.parse(localStorage.getItem('todos')) || [];const todoInput = document.getElementById('todo-input');const addTodoBtn = document.getElementById('add-todo-btn');const todoList = document.getElementById('todo-list');const todoCount = document.getElementById('todo-count');addTodoBtn.addEventListener('click', addTodo);todoList.addEventListener('click', handleTodoClick);renderTodos();function addTodo() { const newTodo = { text: todoInput.value, completed: false }; todos.push(newTodo); localStorage.setItem('todos', JSON.stringify(todos)); renderTodos(); todoInput.value = ''; }function handleTodoClick(event) { if (event.target.classList.contains('delete-todo')) { const todoIndex = event.target.dataset.index; todos.splice(todoIndex, 1); localStorage.setItem('todos', JSON.stringify(todos)); renderTodos(); } else if (event.target.classList.contains('todo-item')) { const todoIndex = event.target.dataset.index; todos[todoIndex].completed = !todos[todoIndex].completed; localStorage.setItem('todos', JSON.stringify(todos)); renderTodos(); } }function renderTodos() { todoList.innerHTML = ''; const remainingCount = todos.filter(todo => !todo.completed).length; todoCount.textContent = `Remaining: ${remainingCount}`; todos.forEach((todo, index) => { const todoItem = document.createElement('li'); todoItem.classList.add('todo-item'); todoItem.dataset.index = index; if (todo.completed) { todoItem.classList.add('completed'); } const todoText = document.createTextNode(todo.text); todoItem.appendChild(todoText); const deleteBtn = document.createElement('button'); deleteBtn.classList.add('delete-todo'); deleteBtn.textContent = 'Delete'; deleteBtn.dataset.index = index; todoItem.appendChild(deleteBtn); todoList.appendChild(todoItem); }); }</script></body></html>
